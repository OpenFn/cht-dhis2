    steps:
      - id: check-if-event-exist
        name: Check if event exist
        expression: |
          import { get } from '@openfn/language-dhis2';

          export default [
            get(
              'events',
              {
                orgUnit:      state.orgUnit,
                program:      state.localconfig.programId,
                programStage: state.localconfig.programStage,
                filter:       state.filter
              }
            ),

            fn(state => {
              const events = state.data.events || [];
              if (events.length > 0) {
                const uid = events[0].event;
                console.log(`Existing event found (ID = ${uid}). Will update.`);
                state.existingEventId = uid;
              } else {
                console.log('No existing event found. Proceeding with create.');
                state.existingEventId = null;
              }
              return state;
            })
          ];
        adaptor: '@openfn/language-dhis2@8.0.3'
        openfn:
          uuid: 72783d24-dc0f-4f77-8aa7-02c1a99ab050
        configuration: rkenyuri@icrc.org|DHIS2 PLAY dev 2-40
        next:
          create-or-update-event-program:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: 6ebf458c-50e7-48e8-8742-198bfc86f3e3
      - id: configure-program
        name: Configure Program
        expression: >-
          fn(state => {
            state.localconfig = {
              programId: "GaOaL76FraA",
              caseId: "IsrhSrEFAX8",
              programStage: "otnWqv9MAzn"
            };

            state.filter = `${state.localconfig.caseId}:EQ:${state.case_id}`;
            console.log(state.filter);

            // Normalize age if present
            if ('age_in_months' in state.properties) {
              const rawAge = parseFloat(state.properties.age_in_months);

              // Check for NaN and ensure it's a valid number >= 0
              if (!isNaN(rawAge) && rawAge >= 0) {
                // DHIS2 INTEGER_POSITIVE means ≥1, so enforce minimum of 1
                const age = Math.floor(rawAge);
                state.properties.age_in_months = age >= 1 ? age : 1;
              } else {
                console.warn('⚠️ Invalid age_in_months value:', state.properties.age_in_months);
                delete state.properties.age_in_months; // or set to null if you prefer
