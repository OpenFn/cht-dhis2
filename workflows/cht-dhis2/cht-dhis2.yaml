id: cht-dhis2
name: CHT-DHIS2
start: webhook
steps:
  - id: check-existing-events
    name: Check Existing Events
    adaptor: '@openfn/language-dhis2@6.3.1'
    configuration: rkenyuri@icrc.org|DHIS2 PLAY dev 2-40
    expression: ./check-existing-events.js
    next:
      create-event:
        disabled: false
        condition: on_job_success
  - id: create-event
    name: Create Event
    adaptor: '@openfn/language-dhis2@6.3.1'
    configuration: rkenyuri@icrc.org|DHIS2 PLAY dev 2-40
    expression: ./create-event.js
  - id: map-cht-submission
    name: Map CHT Submission
    adaptor: '@openfn/language-common@latest'
    expression: ./map-cht-submission.js
    next:
      check-existing-events:
        disabled: false
        condition: on_job_success
  - id: webhook
    type: webhook
    enabled: true
    webhook_reply: before_start
    next:
      map-cht-submission:
        disabled: false
        condition: always
